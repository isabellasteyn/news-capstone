services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-news_db}
      MARIADB_USER: ${DB_USER:-news_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-news_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:root-password}
    volumes:
      - news_db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  news_db_data:
